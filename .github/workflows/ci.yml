name: EcoRoute CI Pipeline

on:
  push:
    branches: [ main, master, "feature/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Backend Jest Tests
        run: |
          cd backend
          npm test

  test-frontend:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install
